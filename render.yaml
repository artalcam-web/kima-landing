services:
  - type: web
    name: landinmex
    runtime: static
    staticPublishPath: .
    buildCommand: "echo 'sitio estático, sin build'"
    pullRequestPreviewsEnabled: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
